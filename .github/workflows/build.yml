name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Build
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then grep -E "^e: |What went wrong|error:|Caused by|> " build.log | head -10 | sed 's/^/::error::/'; fi
          exit $code
      - uses: actions/upload-artifact@v4
        with: { name: Journey-apk, path: app/build/outputs/apk/debug/*.apk }
